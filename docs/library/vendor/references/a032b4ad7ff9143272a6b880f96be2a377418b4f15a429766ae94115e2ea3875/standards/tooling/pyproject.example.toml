[tool.ruff]
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = [
  ".venv-lint", "resources", "docs/status/archive", "**/inbox/**", "**/status/**",
  "tools/papers_cleanup", "tools/rgtools.py", "examples", "experiments", "papers",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These standalone CLIs/tests bootstrap local imports before package installation.
"src/automation/**/*.py" = ["E402"]
"tools/*.py" = ["E402"]
"tools/tests/*.py" = ["E402"]
# Native certificate trust must be initialized before requests/urllib3 imports.
"src/automation/biblatex/pdf_inbox_ingest.py" = ["E402", "I001"]
"src/automation/biblatex/biblatex_verify_reality.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tools"]
exclude = [
  "**/__pycache__", "**/inbox", "**/status", ".cache", ".venv-lint",
  "tools/papers_cleanup", "tools/rgtools.py", "resources", "examples", "experiments", "papers",
]
# Existing standalone tools import siblings and bootstrap these paths at runtime.
extraPaths = [
  "tools", "src/automation/biblatex", "src/automation/images", "src/automation/intake",
]
reportUnnecessaryTypeIgnoreComment = "warning"
enableTypeIgnoreComments = false
