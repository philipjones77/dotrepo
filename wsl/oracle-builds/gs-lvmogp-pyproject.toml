[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gs-lvmogp-oracle"
version = "0.0.0+541d49aaf019"
description = "Local packaging of unmodified official GS-LVMOGP reference modules"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch", "gpytorch", "linear_operator"]

[project.urls]
Source = "https://github.com/XiaoyuJiang17/GS-LVMOGP"

[tool.setuptools]
py-modules = ["LVMOGP", "IndepMOGP"]
